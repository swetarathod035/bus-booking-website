{% extends 'base.html' %}

{% block title %}Change Password — AnandBus{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:480px;">
  <div class="card border-0 shadow-sm rounded-4 p-4">
    <h4 class="fw-bold mb-4" style="color:var(--brand-primary);"><i class="fas fa-lock me-2"></i>Change Password</h4>
    <form method="POST">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label fw-semibold small">{{ field.label }}</label>
          <input type="password" name="{{ field.html_name }}" class="form-control rounded-3" required>
          {% if field.errors %}<div class="invalid-feedback d-block small">{{ field.errors.0 }}</div>{% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn w-100 py-3 rounded-3 fw-bold"
              style="background:#1E3A5F;color:#fff;border:none;">
        <i class="fas fa-lock me-2"></i>Update Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
