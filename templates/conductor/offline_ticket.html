{% extends 'base.html' %}

{% block title %}Issue Offline Ticket{% endblock %}

{% block content %}
<div class="container py-4" style="max-width:600px;">
  <div class="d-flex align-items-center gap-3 mb-4">
    <a href="{% url 'conductor:trip_detail' schedule.id %}" class="btn btn-sm btn-outline-secondary rounded-3">
      <i class="fas fa-arrow-left me-1"></i>Back
    </a>
    <div>
      <h4 class="fw-bold mb-0" style="color:var(--brand-primary);">Issue Offline Ticket</h4>
      <small class="text-muted">{{ schedule.route.route_name }} · {{ schedule.travel_date }}</small>
    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-4 p-4">
    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Boarding Stop</label>
        <select class="form-select" name="boarding_stop" required>
          {% for rs in route_stops %}
            <option value="{{ rs.stop.code }}">{{ rs.stop.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Alighting Stop</label>
        <select class="form-select" name="alighting_stop" required>
          {% for rs in route_stops %}
            <option value="{{ rs.stop.code }}">{{ rs.stop.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Seat Number(s)</label>
        <input type="text" class="form-control" name="seat_numbers" placeholder="e.g. 3A, 3B" required>
        <div class="form-text">Comma-separated for multiple seats</div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">No. of Passengers</label>
        <input type="number" class="form-control" name="passenger_count" min="1" max="10" value="1" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Cash Collected (₹)</label>
        <input type="number" class="form-control" name="amount" step="0.01" min="0" required>
      </div>
      <button type="submit" class="btn w-100 py-3 rounded-3 fw-bold"
              style="background:linear-gradient(135deg,#1E3A5F,#2980B9);color:#fff;border:none;">
        <i class="fas fa-ticket-alt me-2"></i>Issue Ticket
      </button>
    </form>
  </div>
</div>
{% endblock %}
